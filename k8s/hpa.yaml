apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaling-lunch-rush-backend
  namespace: scaling-lunch-rush
  labels:
    app: scaling-lunch-rush-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaling-lunch-rush-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
